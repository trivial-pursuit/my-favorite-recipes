spring:
  jpa:
    open-in-view: false
  flyway:
    locations: classpath:/db/migration/structure

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      access: read_only
      show-details: always
      show-components: always
    info:
      access: read_only
  info:
    java:
      enabled: true

springdoc:
  swagger-ui:
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
